ancestor: null
releases:
  1.0.0:
    modules:
    - description: This module is used to manage OPNSense firewall rules
      name: firewall_rules
      namespace: ''
    - description: Manage OPNsense users
      name: system_access_users
      namespace: ''
    - description: Configure general settings mainly concern network-related settings
        like the hostname.
      name: system_settings_general
      namespace: ''
    - description: Configure logging settings.
      name: system_settings_logging
      namespace: ''
    release_date: '2024-04-20'
  1.1.0:
    changes:
      bugfixes:
      - version_util - Use `product_series` for version detection to avoid minor version
        mismatches.
    fragments:
    - 109-use-product-series-in-version-detection.yml
    modules:
    - description: This module can be used to assign interfaces to network ports and
        network IDs to new interfaces.
      name: interfaces_assignments
      namespace: ''
    release_date: '2024-04-23'
  1.1.1:
    changes:
      bugfixes:
      - system_access_users_utils - Handle additional XML attributes of user objects
        that are not yet handled by the system_access_users module.
    fragments:
    - 112-fix-user-extra-attributes-in-system_access_users.yml
    release_date: '2024-04-24'
  1.2.0:
    changes:
      bugfixes:
      - interfaces_assignments - Include plugin interfaces such as VLAN, VXLANs etc.
        in validations.
      - module_index - Password entry now matches configure_function structure.
      - system_access_users - Introduced password sanitization to fix parsing errors.
      - system_access_users - Introduced password verification to fix passwords not
        being updated.
      - system_access_users - Remove the UserLoginEnum type to prevent strict validation.
      - system_access_users - Updated set_user_password dict calls in order to work
        with the newly introduced structure
      - system_access_users - apikeys are changed if updated
      - system_access_users - apikeys parameters are now passed as a list of dicts
      minor_changes:
      - config_utils - Raise exceptions that occur within an OPNsenseConfigContext
        with traceback.
      - system_access_users - Enhanced group removal handling
    fragments:
    - 117-remove-user-shell-attribute-as-enum.yml
    - 122-implement-password-sanitation-before-hashing.yml
    - 124-fix-password-module-index-entry.yml
    - 129-include-plugin-interfaces-for-assignments.yml
    - 130-fix-apikeys-attribute-as-list.yml
    - 132-improve-exception-handling-in-opnsenseconfigcontext.yml
    modules:
    - description: Configure high availability settings
      name: system_high_availability_settings
      namespace: ''
    release_date: '2024-06-28'
  1.2.1:
    changes:
      bugfixes:
      - firewall_rules_utils - Handle additional XML attributes for the firewall rule
        objects from the config.
    fragments:
    - 143-add-extra-attributes-to-firewall-rules.yml
    release_date: '2024-08-05'
  1.3.0:
    changes:
      major_changes:
      - '@kdhlab added general OPNsense 24.7 support to the collection'
      - system_high_availability_settings - Refactoring for 24.7 support
    fragments:
    - 146-add-24.7-support.yml
    - 149-update-high_availability_settings-for-24.7.yml
    release_date: '2024-08-19'
  1.4.0:
    modules:
    - description: Configure firewall aliases.
      name: firewall_alias
      namespace: ''
    release_date: '2024-08-26'
  1.4.1:
    changes:
      bugfixes:
      - system_settings_logging - fix XPath migrations for settings in 24.7.
    fragments:
    - 153-fix-system-settings-logging-24.7-support.yml
    release_date: '2024-08-29'
  1.5.0:
    changes:
      bugfixes:
      - puzzle.opnsense.system_access_users - Thanks to @GBBx fixed a bug which falsely
        adds empty parameters to user instance.
      - puzzle.opnsense.system_access_users - Thanks to @GBBx fixed a bug while user
        deletion.
      minor_changes:
      - puzzle.opnsense.opnsense_configure - Addition of an ansible role to the collection
    fragments:
    - 155-add-opnsense-config-role.yml
    - 160-fix-user-removal.yml
    - 161-fix-empty-parameters-handling.yml
    release_date: '2024-11-26'
  2.0.0:
    changes:
      breaking_changes:
      - OPNsense 22.7 support has been dropped.
      - OPNsense 23.1 support has been dropped.
      - OPNsense 23.7 support has been dropped.
      deprecated_features:
      - firewall_alias - Use oxlorg.opnsense.alias instead
      - firewall_rules - Use oxlorg.opnsense.rule instead
      - system_access_users - Use oxlorg.opnsense.user, oxlorg.opnsense.group and
        oxlorg.opnsense.privilege instead.
      - system_high_availability_settings - Use oxlorg.opnsense.hasync_general and
        oxlorg.opnsense.hasync_service instead.
      - system_settings_logging - Use oxlorg.opnsense.syslog instead
      major_changes:
      - OPNsense 25.7 support
      minor_changes:
      - plugins.module_utils.xml_utils:elements_equal - Fix element content comparison
        behaviour
    fragments:
    - 164-fix-xml-element-comparison-util.yml
    - 166-deprecate-modules.yml
    - 167-drop-22.7.yml
    - 168-drop-23.1.yml
    - 181-add-25.7-support.yml
    release_date: '2025-11-03'
  3.0.0:
    changes:
      breaking_changes:
      - The minimum supported ``ansible-core`` is now 2.18. ``ansible-core`` 2.12
        through 2.17 are no longer tested or supported, as their lowest supported
        control-node Python is below the new floor.
      - The minimum supported control-node Python is now 3.11. Python 3.8, 3.9 and
        3.10 are no longer supported.
      - ci - raise minimum Python to 3.11 and drop ansible-core <2.18 support; add
        ansible-core 2.18/2.19/2.20 and Python 3.13/3.14 to CI matrix
      - module_index - drop OPNsense 24.1 from VERSION_MAP
      bugfixes:
      - interfaces_assignments - add OPNsense 26.1 molecule platform, remove 24.1
      - system_settings_general - update configure functions for OPNsense 26.1 (system_resolver_configure
        replaces system_trust_configure/system_hosts_generate/system_resolvconf_generate);
        add 26.1 molecule platform, remove 24.1
      deprecated_features:
      - firewall_alias - will be removed in version 4.0.0; use oxlorg.opnsense.alias
        instead
      - firewall_rules - will be removed in version 4.0.0; use oxlorg.opnsense.rule
        instead
      - system_high_availability_settings - will be removed in version 5.0.0; use
        oxlorg.opnsense.hasync_general and oxlorg.opnsense.hasync_service instead
      - system_settings_logging - will be removed in version 4.0.0; use oxlorg.opnsense.syslog
        instead
      minor_changes:
      - CI matrix updated to test against ``ansible-core`` 2.18, 2.19 and ``devel``
        on Python 3.11, 3.12 and 3.13.
      - module_index - add OPNsense 26.1 to VERSION_MAP for interfaces_assignments
        and system_settings_general
      removed_features:
      - system_access_users - will be removed in version 4.0.0; use oxlorg.opnsense.user,
        oxlorg.opnsense.group and oxlorg.opnsense.privilege instead
    fragments:
    - 197-drop-python-up-to-3.10-ansible-up-to-2.17.yml
    - add-26.1-support.yml
    - drop-python-3.10-ansible-2.14.yml
    - interfaces-assignments-26.1.yml
    - remove-firewall-alias.yml
    - remove-firewall-rules.yml
    - remove-system-access-users.yml
    - remove-system-high-availability-settings.yml
    - remove-system-settings-logging.yml
    - system-settings-general-26.1.yml
    release_date: '2026-06-10'
